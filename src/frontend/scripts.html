<script>
  /* ==========================================================================
     RCI Inventory Tracker — client app
     Vanilla JS. All server calls go through google.script.run (promisified).

     ---------------------------------------------------------------------------
     BACKEND CONTRACT (for the JS Engineer implementing BigQuery.gs)
     Each window.RCI.* call resolves with the shape below, or rejects (the
     failure handler) on error. No {success,error} envelope is needed — a
     thrown server error surfaces in .catch().

       getDashboard()  ->  {
         metrics:  { total, overdue, due_soon, serviced_this_month },   // ints
         fleet:    [ VehicleCard, ... ],     // sorted overdue → due_soon → rest
         recentActivity: [ Activity, ... ]   // newest first, ~15 items
       }

       listVehicles({ type, status, search, lifecycle }) -> [ VehicleCard, ... ]
         lifecycle: 'active' (default) | 'inactive' | 'all'

       setVehicleStatus(id, 'active'|'inactive') -> getVehicle() payload

       getVehicle(id) -> {
         vehicle:   Vehicle,                 // full row
         status:    'overdue'|'due_soon'|'up_to_date'|'no_schedule',
         schedules: [ Rule, ... ],           // active rules only
         records:   [ Record, ... ]          // newest first
       }

       addVehicle(Vehicle)      -> Vehicle (saved, incl. id)
       updateVehicle(Vehicle)   -> Vehicle (must include id)
       logService(Record)       -> Record  (saved)
       saveScheduleRule(Rule)   -> Rule     (saved; id present = update)
       uploadPhoto(vehicleId, dataUrl, filename) -> "https://drive…/view" (string)

     VehicleCard = {
       id, name, type ('vehicle'|'machinery'), make, model, year,
       odometer_unit ('miles'|'hours'), current_reading,
       status, last_service_date (ISO date|null),
       lifecycle ('active'|'inactive'),
       next_due_date (ISO date|null), next_due_reading (number|null)
     }
     Vehicle  = VehicleCard fields + vin_serial, license_plate, photo_url, notes
     Record   = { id, vehicle_id, service_date, service_type, odometer_at_service,
                  description, technician_name, photo_urls (JSON string OR array),
                  created_at }
     Rule     = { id?, vehicle_id, rule_label, interval_type
                  ('time'|'mileage'|'hours'|'manual'), interval_value,
                  next_due_date, next_due_reading, is_manual_flag, active }
     ========================================================================== */

  (function () {
    'use strict';

    /* -------------------------------------------------------------------- */
    /* Session + server-call helper (promisified google.script.run)         */
    /* -------------------------------------------------------------------- */
    // The signed session token minted by the server after Google sign-in.
    // It is prepended to EVERY server call; each endpoint validates it.
    var SESSION = null;
    var SESSION_KEY = 'rci_session';

    function getStoredSession() {
      try { return localStorage.getItem(SESSION_KEY) || null; } catch (e) { return null; }
    }
    function clearStoredSession() {
      try { localStorage.removeItem(SESSION_KEY); } catch (e) {}
    }

    function callServer(fn, args) {
      return new Promise(function (resolve, reject) {
        var all = [SESSION].concat(args || []); // token is always the first argument
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function (err) {
            // Session expired or revoked → drop to the sign-in screen.
            var msg = (err && err.message) ? err.message : '';
            if (/AUTH_REQUIRED|AUTH_FORBIDDEN/.test(msg)) {
              clearStoredSession();
              SESSION = null;
              showLoginGate(msg.indexOf('FORBIDDEN') >= 0
                ? 'Your account is no longer on the access list.'
                : 'Your session expired. Please sign in again.');
            }
            reject(err);
          })
          [fn].apply(null, all);
      });
    }

    /* -------------------------------------------------------------------- */
    /* Small DOM / format utilities                                         */
    /* -------------------------------------------------------------------- */
    function $(sel, root) { return (root || document).querySelector(sel); }
    function setHTML(sel, html) { var n = $(sel); if (n) n.innerHTML = html; }

    function escapeHtml(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Accepts 'YYYY-MM-DD' or ISO timestamps; renders e.g. "May 25, 2026".
    function fmtDate(s) {
      if (!s) return '—';
      var str = String(s);
      var m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
      var d = m ? new Date(+m[1], +m[2] - 1, +m[3]) : new Date(str);
      if (isNaN(d)) return escapeHtml(str);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function todayStr() {
      var d = new Date();
      var mm = String(d.getMonth() + 1).padStart(2, '0');
      var dd = String(d.getDate()).padStart(2, '0');
      return d.getFullYear() + '-' + mm + '-' + dd;
    }

    function monthStartStr() {
      var d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01';
    }

    function yearStartStr() {
      return new Date().getFullYear() + '-01-01';
    }

    // Returns the date N days ago as 'YYYY-MM-DD'.
    function daysAgoStr(n) {
      var d = new Date();
      d.setDate(d.getDate() - n);
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function fmtReading(val, unit) {
      if (val == null || val === '') return '—';
      var n = Number(val);
      var num = isNaN(n) ? val : n.toLocaleString();
      return num + ' ' + (unit === 'hours' ? 'hrs' : 'mi');
    }

    function typeIcon(type) { return type === 'machinery' ? '🚜' : '🚚'; }

    var STATUS_LABEL = {
      overdue: 'Overdue', due_soon: 'Due Soon',
      up_to_date: 'Up to Date', no_schedule: 'No Schedule'
    };
    function statusBadge(status) {
      var s = status || 'no_schedule';
      return '<span class="badge badge--' + s + '">' +
             escapeHtml(STATUS_LABEL[s] || 'No Schedule') + '</span>';
    }

    /**
     * Converts a Google Drive share / viewer URL to a thumbnail URL that can be
     * used directly as an <img src>.  Any URL that already points to a thumbnail
     * or non-Drive host is returned unchanged.
     *
     * Handles the two common Drive formats stored by Drive_savePhoto:
     *   https://drive.google.com/file/d/FILE_ID/view
     *   https://drive.google.com/open?id=FILE_ID
     */
    function driveImgUrl(url) {
      if (!url) return url;
      // Already a thumbnail URL — use as-is.
      if (url.indexOf('drive.google.com/thumbnail') >= 0) return url;
      // Extract file ID from /file/d/FILE_ID/... URLs.
      var m = url.match(/\/file\/d\/([^/?#]+)/);
      if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
      // Extract file ID from ?id=FILE_ID or &id=FILE_ID query params.
      m = url.match(/[?&]id=([^&]+)/);
      if (m && url.indexOf('drive.google.com') >= 0) {
        return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';
      }
      return url;
    }

    // photo_urls may arrive as a JSON string or an array; normalize to array.
    function parsePhotoUrls(val) {
      if (!val) return [];
      if (Array.isArray(val)) return val;
      try { var a = JSON.parse(val); return Array.isArray(a) ? a : []; }
      catch (e) { return String(val) ? [String(val)] : []; }
    }

    var SERVICE_TYPES = ['Oil Change', 'Tire Rotation', 'Inspection', 'Repair',
                         'Fluid Check', 'Filter Replacement', 'Other'];

    /* -------------------------------------------------------------------- */
    /* Global UI: error banner, toast, spinner                              */
    /* -------------------------------------------------------------------- */
    function showError(msg) {
      var el = $('#error-banner');
      el.textContent = msg || 'Something went wrong.';
      el.classList.remove('hidden');
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
    function hideError() { $('#error-banner').classList.add('hidden'); }

    function toast(msg, isError) {
      var t = document.createElement('div');
      t.className = 'toast' + (isError ? ' toast--error' : '');
      t.textContent = msg;
      $('#toast-wrap').appendChild(t);
      setTimeout(function () { t.style.opacity = '0'; }, 2300);
      setTimeout(function () { t.remove(); }, 2700);
    }

    function spinner(label) {
      return '<div class="spinner">' + escapeHtml(label || 'Loading…') + '</div>';
    }
    function emptyState(msg) {
      return '<div class="empty-state">' + escapeHtml(msg) + '</div>';
    }

    // Surface a rejected server call consistently.
    function fail(err) {
      var msg = (err && err.message) ? err.message : String(err || 'Server error');
      showError(msg);
    }

    /* -------------------------------------------------------------------- */
    /* Router                                                               */
    /* -------------------------------------------------------------------- */
    var NAV_VIEWS = { dashboard: 1, fleet: 1, reports: 1, add: 1 }; // top-nav views

    var DASHBOARD_VIEWS = { dashboard: 1, fleet: 1, reports: 1 };

    function closeDashboardDropdown() {
      var menu = document.getElementById('dashboard-nav-menu');
      if (menu) menu.classList.add('hidden');
    }
    function toggleDashboardDropdown() {
      var menu = document.getElementById('dashboard-nav-menu');
      if (menu) menu.classList.toggle('hidden');
    }

    function navigate(name, params) {
      hideError();
      document.querySelectorAll('.view').forEach(function (v) {
        v.classList.toggle('active', v.id === 'view-' + name);
      });

      // Dashboard dropdown button is active for dashboard / fleet / reports.
      var dashBtn = document.getElementById('dashboard-nav-btn');
      if (dashBtn) dashBtn.classList.toggle('active', !!DASHBOARD_VIEWS[name]);

      // Dropdown items — highlight the current one.
      document.querySelectorAll('.nav-drop-item').forEach(function (item) {
        item.classList.toggle('active', item.dataset.view === name);
      });

      // All other nav-btn elements (Add Vehicle).
      document.querySelectorAll('.nav-btn:not(#dashboard-nav-btn)').forEach(function (b) {
        b.classList.toggle('active', b.dataset.view === name);
      });

      // Close the dropdown whenever any navigation happens.
      closeDashboardDropdown();

      window.scrollTo(0, 0);

      switch (name) {
        case 'dashboard': renderDashboard(); break;
        case 'fleet':     renderFleet(); break;
        case 'reports':   renderReports(params); break;
        case 'detail':    renderDetail(params && params.id); break;
        case 'add':       renderVehicleForm(params && params.id); break;
        case 'log':       renderLogForm(params && params.id); break;
      }
    }

    /* -------------------------------------------------------------------- */
    /* Shared card markup                                                   */
    /* -------------------------------------------------------------------- */
    function nextDueText(v) {
      var bits = [];
      if (v.next_due_date) bits.push(fmtDate(v.next_due_date));
      if (v.next_due_reading != null && v.next_due_reading !== '')
        bits.push(fmtReading(v.next_due_reading, v.odometer_unit));
      return bits.length ? bits.join(' · ') : '—';
    }

    function vehicleCardHTML(v) {
      var sub = [v.year, v.make, v.model].filter(Boolean).join(' ');
      return '' +
        '<button class="vehicle-card" data-action="open-vehicle" data-id="' + escapeHtml(v.id) + '">' +
          '<div class="vc-top">' +
            '<div>' +
              '<div class="vc-name"><span class="type-icon">' + typeIcon(v.type) + '</span> ' + escapeHtml(v.name) + '</div>' +
              (sub ? '<div class="vc-sub">' + escapeHtml(sub) + '</div>' : '') +
            '</div>' +
            (v.lifecycle === 'inactive'
              ? '<span class="badge badge--no_schedule">Inactive</span>'
              : statusBadge(v.status)) +
          '</div>' +
          '<div class="vc-meta">' +
            '<span>Last serviced: <b>' + fmtDate(v.last_service_date) + '</b></span>' +
            '<span>Next due: <b>' + nextDueText(v) + '</b></span>' +
            '<span>Reading: <b>' + fmtReading(v.current_reading, v.odometer_unit) + '</b></span>' +
          '</div>' +
        '</button>';
    }

    /* -------------------------------------------------------------------- */
    /* VIEW: Dashboard                                                      */
    /* -------------------------------------------------------------------- */
    function renderDashboard() {
      setHTML('#dashboard-body', spinner('Loading dashboard…'));
      RCI.getDashboard().then(function (d) {
        d = d || {};
        var m = d.metrics || {};
        var fleet = d.fleet || [];
        var activity = d.recentActivity || [];

        var metrics = '' +
          '<div class="metrics">' +
            metricTile(m.total, 'Total Vehicles', '', '') +
            metricTile(m.overdue, 'Overdue', 'metric--overdue', 'overdue') +
            metricTile(m.due_soon, 'Due Soon', 'metric--due', 'due_soon') +
            metricTile(m.serviced_this_month, 'Serviced This Month', 'metric--ok',
              { action: 'goto-reports', dateFrom: monthStartStr() }) +
          '</div>';

        var fleetList = fleet.length
          ? '<div class="vehicle-grid">' + fleet.map(vehicleCardHTML).join('') + '</div>'
          : emptyState('No vehicles yet. Tap “+ Add Vehicle” to get started.');

        var feed = activity.length
          ? '<div class="activity">' + activity.map(activityHTML).join('') + '</div>'
          : emptyState('No service logged yet.');

        $('#dashboard-body').innerHTML = metrics +
          '<div class="dashboard-grid">' +
            '<div>' +
              '<div class="row-between"><h2 class="section-title">Fleet Status</h2></div>' +
              fleetList +
            '</div>' +
            '<div>' +
              '<h2 class="section-title">Recent Activity</h2>' +
              '<div class="panel">' + feed + '</div>' +
            '</div>' +
          '</div>';
      }).catch(function (e) {
        setHTML('#dashboard-body', '');
        fail(e);
      });
    }

    // opts can be:
    //   a string            → shorthand for { action: 'filter-fleet', filterStatus: <string> }
    //   { action, filterStatus?, dateFrom? }  → full options for any action
    //   undefined/null      → non-clickable tile
    function metricTile(num, label, cls, opts) {
      var action, filterStatus, dateFrom;
      if (opts === null || opts === undefined) {
        // plain, non-clickable
      } else if (typeof opts === 'string') {
        action = 'filter-fleet'; filterStatus = opts;
      } else {
        action = opts.action; filterStatus = opts.filterStatus; dateFrom = opts.dateFrom;
      }

      var inner = '<div class="num">' + escapeHtml(num == null ? 0 : num) + '</div>' +
                  '<div class="lbl">' + escapeHtml(label) + '</div>';

      if (!action) {
        return '<div class="metric ' + cls + '">' + inner + '</div>';
      }

      var dataAttrs = ' data-action="' + escapeHtml(action) + '"';
      if (filterStatus != null) dataAttrs += ' data-filter-status="' + escapeHtml(filterStatus) + '"';
      if (dateFrom != null)     dataAttrs += ' data-date-from="' + escapeHtml(dateFrom) + '"';
      return '<button class="metric ' + cls + ' metric--clickable"' + dataAttrs + '>' + inner + '</button>';
    }

    function activityHTML(a) {
      return '<div class="activity-item">' +
        '<div class="ai-main">' +
          '<span class="ai-veh">' + escapeHtml(a.vehicle_name || 'Vehicle') + '</span> — ' +
          escapeHtml(a.service_type || 'Service') +
          (a.technician_name ? ' <span class="muted">by ' + escapeHtml(a.technician_name) + '</span>' : '') +
        '</div>' +
        '<div class="ai-date">' + fmtDate(a.service_date) + '</div>' +
      '</div>';
    }

    /* -------------------------------------------------------------------- */
    /* VIEW: Fleet (search + filters)                                       */
    /* -------------------------------------------------------------------- */
    var fleetFilters = { type: '', status: '', search: '', lifecycle: 'active' };

    // Navigate to the Fleet view with a pre-applied status filter.
    // Resets all other filters so the user sees a clean, focused list.
    function navigateFleetWithFilter(status) {
      fleetFilters.type      = '';
      fleetFilters.search    = '';
      fleetFilters.lifecycle = 'active';
      fleetFilters.status    = status || '';

      // Sync the search input text if it's already in the DOM.
      var searchEl = document.getElementById('fleet-search');
      if (searchEl) searchEl.value = '';

      // Sync chip active states for all three chip groups.
      ['type', 'status', 'lifecycle'].forEach(function (group) {
        var chipRow = document.querySelector('#view-fleet .chip-row[data-group="' + group + '"]');
        if (!chipRow) return;
        var target = fleetFilters[group];
        chipRow.querySelectorAll('.chip').forEach(function (c) {
          c.classList.toggle('active', (c.dataset.value || '') === target);
        });
      });

      navigate('fleet');
    }
    var fleetSearchTimer = null;

    function renderFleet() {
      loadFleet();
    }

    function loadFleet() {
      setHTML('#fleet-body', spinner('Loading fleet…'));
      RCI.listVehicles(fleetFilters).then(function (rows) {
        rows = rows || [];
        $('#fleet-body').innerHTML = rows.length
          ? '<div class="vehicle-grid">' + rows.map(vehicleCardHTML).join('') + '</div>'
          : emptyState('No vehicles match these filters.');
      }).catch(function (e) {
        setHTML('#fleet-body', '');
        fail(e);
      });
    }

    function wireFleetControls() {
      var search = $('#fleet-search');
      if (search) {
        search.addEventListener('input', function () {
          fleetFilters.search = search.value.trim();
          clearTimeout(fleetSearchTimer);
          fleetSearchTimer = setTimeout(loadFleet, 300);
        });
      }
      document.querySelectorAll('#view-fleet .chip-row').forEach(function (group) {
        var key = group.dataset.group; // 'type' | 'status'
        group.addEventListener('click', function (e) {
          var chip = e.target.closest('.chip');
          if (!chip) return;
          group.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          fleetFilters[key] = chip.dataset.value || '';
          loadFleet();
        });
      });
    }

    /* -------------------------------------------------------------------- */
    /* VIEW: Service Reports                                                */
    /* -------------------------------------------------------------------- */
    var reportsFilters = { search: '', service_type: '', date_from: '', date_to: '', period: 'all' };
    var reportsSearchTimer = null;

    // Maps a period key to { date_from, date_to } strings.
    function periodDates(period) {
      switch (period) {
        case 'month': return { date_from: monthStartStr(), date_to: '' };
        case '30d':   return { date_from: daysAgoStr(30),  date_to: '' };
        case 'year':  return { date_from: yearStartStr(),  date_to: '' };
        default:      return { date_from: '',              date_to: '' };
      }
    }

    function renderReports(params) {
      // Accept optional pre-set filters from a dashboard pill click.
      if (params) {
        if (params.date_from !== undefined) {
          // Find which period chip matches, or fall back to 'all'.
          var matched = 'all';
          ['month', '30d', 'year'].forEach(function (p) {
            if (periodDates(p).date_from === params.date_from) matched = p;
          });
          reportsFilters.period    = matched;
          reportsFilters.date_from = params.date_from || '';
          reportsFilters.date_to   = params.date_to   || '';
        }
        if (params.service_type !== undefined) reportsFilters.service_type = params.service_type;
        if (params.search       !== undefined) reportsFilters.search       = params.search;
      }
      syncReportsFilterUI();
      loadReports();
    }

    // Syncs the chip active states + search input text to match reportsFilters.
    function syncReportsFilterUI() {
      var searchEl = document.getElementById('reports-search');
      if (searchEl) searchEl.value = reportsFilters.search;

      // Period chips
      var periodRow = document.getElementById('reports-period-chips');
      if (periodRow) {
        periodRow.querySelectorAll('[data-period]').forEach(function (c) {
          c.classList.toggle('active', c.dataset.period === reportsFilters.period);
        });
      }

      // Service-type chips
      var typeRow = document.getElementById('reports-type-chips');
      if (typeRow) {
        typeRow.querySelectorAll('.chip').forEach(function (c) {
          c.classList.toggle('active', (c.dataset.value || '') === reportsFilters.service_type);
        });
      }
    }

    function loadReports() {
      setHTML('#reports-body', spinner('Loading service records…'));
      var filters = {
        search:       reportsFilters.search       || undefined,
        service_type: reportsFilters.service_type || undefined,
        date_from:    reportsFilters.date_from    || undefined,
        date_to:      reportsFilters.date_to      || undefined
      };
      RCI.listServiceRecords(filters).then(function (rows) {
        rows = rows || [];
        if (!rows.length) {
          setHTML('#reports-body', emptyState('No service records match these filters.'));
          return;
        }
        var meta = '<div class="reports-meta">' + rows.length +
                   (rows.length === 500 ? '+' : '') + ' record' +
                   (rows.length !== 1 ? 's' : '') + '</div>';
        $('#reports-body').innerHTML = meta +
          '<div class="report-list">' + rows.map(reportRecordHTML).join('') + '</div>';
      }).catch(function (e) {
        setHTML('#reports-body', '');
        fail(e);
      });
    }

    function reportRecordHTML(r) {
      var excerpt = (r.description || '').replace(/\s+/g, ' ').slice(0, 120);
      var meta = [];
      if (r.technician_name) meta.push('By: ' + r.technician_name);
      if (r.odometer_at_service != null && r.odometer_at_service !== '')
        meta.push('Reading: ' + fmtReading(r.odometer_at_service, r.odometer_unit));

      return '<div class="report-record">' +
        '<div class="rr-head">' +
          '<button class="rr-vehicle" data-action="open-vehicle" data-id="' + escapeHtml(r.vehicle_id) + '">' +
            typeIcon(r.vehicle_type) + ' ' + escapeHtml(r.vehicle_name || 'Vehicle') +
          '</button>' +
          '<div class="rr-right">' +
            '<span class="badge badge--type">' + escapeHtml(r.service_type || 'Service') + '</span>' +
            '<span class="rr-date">' + fmtDate(r.service_date) + '</span>' +
          '</div>' +
        '</div>' +
        (excerpt ? '<div class="rr-desc">' + escapeHtml(excerpt) + (r.description && r.description.length > 120 ? '…' : '') + '</div>' : '') +
        (meta.length ? '<div class="rr-meta">' + meta.map(escapeHtml).join(' · ') + '</div>' : '') +
      '</div>';
    }

    function wireReportsControls() {
      var search = document.getElementById('reports-search');
      if (search) {
        search.addEventListener('input', function () {
          reportsFilters.search = search.value.trim();
          clearTimeout(reportsSearchTimer);
          reportsSearchTimer = setTimeout(loadReports, 300);
        });
      }

      // Period chips (all time / this month / last 30 days / this year)
      var periodRow = document.getElementById('reports-period-chips');
      if (periodRow) {
        periodRow.addEventListener('click', function (e) {
          var chip = e.target.closest('[data-period]');
          if (!chip) return;
          // handled centrally by the global click delegation below via reports-period action
        });
      }

      // Service-type chips
      var typeRow = document.getElementById('reports-type-chips');
      if (typeRow) {
        typeRow.addEventListener('click', function (e) {
          var chip = e.target.closest('.chip');
          if (!chip) return;
          typeRow.querySelectorAll('.chip').forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');
          reportsFilters.service_type = chip.dataset.value || '';
          loadReports();
        });
      }
    }

    /* -------------------------------------------------------------------- */
    /* VIEW: Vehicle Detail                                                 */
    /* -------------------------------------------------------------------- */
    var currentVehicleId = null;

    function renderDetail(id) {
      if (id) currentVehicleId = id;
      id = currentVehicleId;
      if (!id) { navigate('fleet'); return; }

      setHTML('#detail-body', spinner('Loading vehicle…'));
      RCI.getVehicle(id).then(function (data) {
        data = data || {};
        var v = data.vehicle || {};
        var status = data.status || 'no_schedule';
        var schedules = (data.schedules || []).filter(function (r) { return r.active !== false; });
        var records = data.records || [];

        // If no key picture is set, fall back to the most recent service photo.
        var displayPhotoUrl = v.photo_url;
        if (!displayPhotoUrl) {
          for (var ri = 0; ri < records.length; ri++) {
            var svcPhotos = parsePhotoUrls(records[ri].photo_urls);
            if (svcPhotos.length) { displayPhotoUrl = svcPhotos[0]; break; }
          }
        }
        var photo = displayPhotoUrl
          ? '<img class="detail-photo" src="' + escapeHtml(driveImgUrl(displayPhotoUrl)) + '" alt="' + escapeHtml(v.name) + '">'
          : '<div class="detail-photo detail-photo--placeholder">' + typeIcon(v.type) + '</div>';

            '<button class="btn btn-secondary" data-action="edit-vehicle" data-id="' + escapeHtml(v.id) + '">Edit Vehicle</button>' +
            '<button class="btn btn-danger" data-action="retire-vehicle" data-id="' + escapeHtml(v.id) + '">Mark Inactive</button>';

        var inactiveNotice = isInactive
          ? '<p class="muted" style="margin-top:10px">This vehicle is inactive — hidden from the dashboard and the default fleet view. Its service history is preserved.</p>'

    function stat(k, v) {
      return '<div class="st"><span class="k">' + escapeHtml(k) + '</span>' +
             '<span class="v">' + v + '</span></div>';
    }

    function ruleHTML(r, v) {
      var detail, next, over = false;
      if (r.is_manual_flag || r.interval_type === 'manual') {
        detail = 'Manual flag';
        next = 'Needs service';
        over = true;
      } else if (r.interval_type === 'time') {
        detail = 'Every ' + escapeHtml(r.interval_value) + ' month(s)';
        next = fmtDate(r.next_due_date);
        over = r.next_due_date && new Date(r.next_due_date) < new Date(todayStr());
      } else {
        detail = 'Every ' + Number(r.interval_value).toLocaleString() + ' ' + (r.interval_type === 'hours' ? 'hrs' : 'mi');
        next = fmtReading(r.next_due_reading, r.interval_type === 'hours' ? 'hours' : 'miles');
        over = r.next_due_reading != null && Number(v.current_reading) > Number(r.next_due_reading);
      }
      return '<div class="rule">' +
        '<div><div class="r-label">' + escapeHtml(r.rule_label || 'Service rule') + '</div>' +
        '<div class="r-detail">' + detail + '</div></div>' +
        '<div class="r-next' + (over ? ' over' : '') + '">' + next + '</div>' +
      '</div>';
    }

    function recordHTML(rec) {
      var photos = parsePhotoUrls(rec.photo_urls);
      var photosHTML = photos.length
        ? '<div class="record-photos">' + photos.map(function (u) {

        : '';

      return '<div class="record">' +
        '<button class="record-head" data-action="toggle-record">' +
          '<span class="rh-date">' + fmtDate(rec.service_date) + '</span>' +
          '<span class="badge badge--type rh-type">' + escapeHtml(rec.service_type || 'Service') + '</span>' +
          '<span class="rh-excerpt">' + escapeHtml(excerpt) + '</span>' +
          '<span class="rh-caret">▸</span>' +
        '</button>' +
        '<div class="record-body hidden">' +
          '<div class="rb-row"><span class="k">Reading</span><div>' + fmtReading(rec.odometer_at_service, null) + '</div></div>' +
          (rec.technician_name ? '<div class="rb-row"><span class="k">Technician</span><div>' + escapeHtml(rec.technician_name) + '</div></div>' : '') +
          '<div class="rb-row"><span class="k">Work Done</span><div class="rb-desc">' + escapeHtml(rec.description || '—') + '</div></div>' +

    function submitVehicle(existing) {
      var name = $('#v-name').value.trim();
      if (!name) { showError('Vehicle name is required.'); return; }

      var payload = {
        name: name,
        type: $('#v-type').value,
        make: $('#v-make').value.trim(),
        model: $('#v-model').value.trim(),
        year: $('#v-year').value ? parseInt($('#v-year').value, 10) : null,
        vin_serial: $('#v-vin').value.trim(),
        license_plate: $('#v-plate').value.trim(),
        odometer_unit: $('#v-unit').value,
        current_reading: $('#v-reading').value ? parseFloat($('#v-reading').value) : 0,
        notes: $('#v-notes').value.trim()
      };
      if (existing && existing.id) {
        payload.id = existing.id;
        payload.photo_url = existing.photo_url || null;
        payload.status = existing.status || 'active';
      }

      var btn = $('#vehicle-form button[type=submit]');
      btn.disabled = true; btn.textContent = 'Saving…';

      var photos = pendingPhotos($('#add-body')); // 0 or 1 for vehicle

      function done(saved) {
        toast('Vehicle saved.');
        navigate('detail', { id: saved.id });
      }

      var save = (existing && existing.id) ? RCI.updateVehicle : RCI.addVehicle;
      save(payload).then(function (saved) {
        saved = saved || payload;
        if (!photos.length) { done(saved); return; }
        // Upload the photo now that we have an id, then patch photo_url.
        RCI.uploadPhoto(saved.id, photos[0].dataUrl, photos[0].name).then(function (url) {
          saved.photo_url = url;
          RCI.updateVehicle(saved).then(function () { done(saved); })
            .catch(function () { done(saved); }); // vehicle saved; photo patch failed silently
        }).catch(function () { toast('Vehicle saved (photo upload failed).', true); navigate('detail', { id: saved.id }); });
      }).catch(function (e) {
        btn.disabled = false;
        btn.textContent = (existing && existing.id) ? 'Save Changes' : 'Save Vehicle';
        fail(e);
      });
    }

    function submitLog(v) {
      var desc = $('#l-desc').value.trim();
      if (!desc) { showError('Please describe the work completed.'); return; }

      var record = {
        vehicle_id: v.id,
        service_date: $('#l-date').value || todayStr(),
        service_type: $('#l-type').value,

      };

      btn.disabled = true; btn.textContent = 'Submitting…';

      uploadAll(v.id, photos).then(function (urls) {
        record.photo_urls = JSON.stringify(urls);
        return RCI.logService(record);

      var urls = [];
      return photos.reduce(function (chain, p) {
        return chain.then(function () {
          return RCI.uploadPhoto(vehicleId, p.dataUrl, p.name).then(function (url) { urls.push(url); });
        });
      }, Promise.resolve()).then(function () { return urls; });
    }

    function field(label, id, type, value, required, hint) {
      return '<div class="form-group">' +
        '<label for="' + id + '">' + escapeHtml(label) + (required ? ' <span class="req">*</span>' : '') + '</label>' +
        '<input id="' + id + '" type="' + type + '" value="' + escapeHtml(value == null ? '' : value) + '"' +
          (required ? ' required' : '') + (type === 'number' ? ' inputmode="decimal" step="any"' : '') + '>' +
        (hint ? '<div class="hint">' + escapeHtml(hint) + '</div>' : '') +

    }

    function selectField(label, id, options, selected) {
      var opts = options.map(function (o) {
        return '<option value="' + escapeHtml(o[0]) + '"' + (o[0] === selected ? ' selected' : '') + '>' +
               escapeHtml(o[1]) + '</option>';
      }).join('');
      return '<div class="form-group"><label for="' + id + '">' + escapeHtml(label) + '</label>' +
             '<select id="' + id + '">' + opts + '</select></div>';
    }

    function photoField(mode) {
      var multi = mode === 'multi';
      var multiAttr = multi ? ' multiple' : '';
      return '<div class="form-group">' +
        '<label>' + (multi ? 'Photos' : 'Photo') + '</label>' +
        '<div class="photo-btns">' +
          '<label class="photo-btn-label">' +
            '📷 Camera' +
            '<input class="photo-input" type="file" accept="image/*" capture="environment"' + multiAttr + ' data-photo-input>' +
          '</label>' +
          '<label class="photo-btn-label">' +
            '📁 Upload from Device' +
            '<input class="photo-input" type="file" accept="image/*"' + multiAttr + ' data-photo-input>' +
          '</label>' +
        '</div>' +
        '<div class="photo-previews" data-photo-previews></div>' +
      '</div>';
    }

    // Per-form photo store, keyed by the container element.
    var photoStore = new WeakMap();

    function wirePhotoField(container, multi) {
      photoStore.set(container, []);
      var inputs = Array.prototype.slice.call(container.querySelectorAll('[data-photo-input]'));
      var previews = container.querySelector('[data-photo-previews]');
      if (!inputs.length) return;

      inputs.forEach(function (input) {
        input.addEventListener('change', function () {
          var files = Array.prototype.slice.call(input.files || []);
          var store = photoStore.get(container);
          if (!multi) { store.length = 0; previews.innerHTML = ''; }
          files.forEach(function (file) {
            if (!/^image\//.test(file.type)) return;
            readFileAsDataUrl(file).then(function (dataUrl) {
              return compressImage(dataUrl, 1200, 0.78);
            }).then(function (compressed) {
              var item = { name: file.name || ('photo_' + Date.now() + '.jpg'), dataUrl: compressed };
              store.push(item);
              repaintPreviews(previews, store);
            });
          });
          input.value = ''; // allow re-selecting the same file
        });
      });

      previews.addEventListener('click', function (e) {
        var rm = e.target.closest('.rm');
        if (!rm) return;
        var store = photoStore.get(container);
        var idx = parseInt(rm.dataset.idx, 10);
        store.splice(idx, 1);
        repaintPreviews(previews, store);
      });
    }

    function addPreview(previews, store, item) {
      repaintPreviews(previews, store);
    }
    function repaintPreviews(previews, store) {
      previews.innerHTML = store.map(function (it, i) {
        return '<div class="photo-thumb"><img src="' + it.dataUrl + '" alt="preview">' +
               '<button type="button" class="rm" data-idx="' + i + '" aria-label="Remove">×</button></div>';
      }).join('');
    }
    function pendingPhotos(container) { return photoStore.get(container) || []; }

    function readFileAsDataUrl(file) {
      return new Promise(function (resolve, reject) {
        var fr = new FileReader();
        fr.onload = function () { resolve(fr.result); };
        fr.onerror = reject;
        fr.readAsDataURL(file);
      });
    }

    // Resize + re-encode to JPEG to keep uploads well under google.script.run's
    // ~1 MB per-argument limit. Falls back to the original if anything fails.
    function compressImage(dataUrl, maxWidth, quality) {
      return new Promise(function (resolve) {
        try {
          var img = new Image();
          img.onload = function () {
            try {
              var w = img.width, h = img.height;
              if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
              var canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', quality || 0.78));
            } catch (ex) { resolve(dataUrl); }
          };
          img.onerror = function () { resolve(dataUrl); };
          img.src = dataUrl;
        } catch (ex) { resolve(dataUrl); }
      });
    }

    function modalRuleHTML(r) {
      var desc = (r.interval_type === 'manual' || r.is_manual_flag)
        ? 'Manual flag'
        : 'Every ' + escapeHtml(r.interval_value) + ' ' +
          (r.interval_type === 'time' ? 'month(s)' : r.interval_type === 'hours' ? 'hrs' : 'mi');
      return '<div class="rule">' +
        '<div><div class="r-label">' + escapeHtml(r.rule_label || 'Rule') + '</div>' +

    function addRule(vehicleId) {
      var label = $('#r-label').value.trim();
      var type = $('#r-type').value;
      var valEl = $('#r-value');
      if (!label) { toast('Rule label is required.', true); return; }
      var isManual = type === 'manual';
      if (!isManual && (!valEl.value || parseFloat(valEl.value) <= 0)) {
        toast('Enter a positive interval.', true); return;
      }
      var rule = {
        vehicle_id: vehicleId,
        rule_label: label,
        interval_type: type,
        interval_value: isManual ? null : parseFloat(valEl.value),
        is_manual_flag: isManual,
        active: true
      };
      var btn = $('#rule-form button[type=submit]');
      btn.disabled = true; btn.textContent = 'Adding…';
      RCI.saveScheduleRule(rule).then(function () {
        toast('Rule added.');
        closeModal();
        if (currentVehicleId === vehicleId) renderDetail(vehicleId);
      }).catch(function (e) {
        btn.disabled = false; btn.textContent = 'Add Rule';
        toast((e && e.message) || 'Could not add rule.', true);
      });
    }

          return '<button class="vehicle-pick-item" data-action="pick-vehicle-for-service" data-id="' + escapeHtml(v.id) + '">' +
            '<span class="vpi-icon">' + typeIcon(v.type) + '</span>' +
            '<div class="vpi-info">' +
              '<div class="vpi-name">' + escapeHtml(v.name) + '</div>' +
              (sub ? '<div class="vpi-sub">' + escapeHtml(sub) + '</div>' : '') +
            '</div>' +
            statusBadge(v.status) +
          '</button>';
        }).join('');
      }

      RCI.listVehicles({ lifecycle: 'active' }).then(function (vehicles) {
        allVehicles = vehicles || [];
        renderPickerList(allVehicles);
        var searchEl = document.getElementById('service-picker-search');
        if (searchEl) {
          searchEl.addEventListener('input', function () {
            var q = searchEl.value.toLowerCase().trim();
            var filtered = q ? allVehicles.filter(function (v) {
              return (v.name || '').toLowerCase().indexOf(q) >= 0 ||
                     (v.make || '').toLowerCase().indexOf(q) >= 0 ||
                     (v.model || '').toLowerCase().indexOf(q) >= 0;
            }) : allVehicles;
            renderPickerList(filtered);
          });
          searchEl.focus();
        }
      }).catch(function () {
        var el = document.getElementById('service-picker-list');
        if (el) el.innerHTML = '<p class="muted" style="text-align:center;padding:16px">Could not load vehicles.</p>';
      });
    }

    /* Success modal shown after saving a service record */
    function showServiceSuccessModal(vehicleId, vehicleName) {
      setHTML('#modal-root',
        '<div class="modal-backdrop">' +
          '<div class="modal">' +
            '<div class="modal-body success-modal-body">' +
              '<div class="success-icon">✅</div>' +
              '<h3 class="success-title">Service Record Saved!</h3>' +
              '<p class="muted success-msg">The service record for <strong>' + escapeHtml(vehicleName || 'this vehicle') + '</strong> has been saved.</p>' +
              '<button class="btn btn-accent btn-block btn-lg" data-action="goto-vehicle-after-service" data-id="' + escapeHtml(vehicleId) + '">View Vehicle</button>' +
            '</div>' +
          '</div>' +
        '</div>'
      );
    }

    /* -------------------------------------------------------------------- */
    /* Retire / reactivate a vehicle (soft delete)                          */
    /* -------------------------------------------------------------------- */
    function setVehicleLifecycle(id, status) {
      RCI.setVehicleStatus(id, status).then(function () {
        toast(status === 'inactive' ? 'Vehicle marked inactive.' : 'Vehicle reactivated.');
        renderDetail(id);
      }).catch(fail);
    }

    /* -------------------------------------------------------------------- */
    /* Global event delegation                                              */
    /* -------------------------------------------------------------------- */
    document.addEventListener('click', function (e) {
      // Close dashboard dropdown on outside click.
      var dropWrap = document.getElementById('dashboard-nav-wrap');
      if (dropWrap && !dropWrap.contains(e.target)) closeDashboardDropdown();

      // Modal close (backdrop or X)
      if (e.target.closest('[data-modal-close]') ||
          (e.target.matches && e.target.matches('[data-modal-backdrop]'))) {
        closeModal(); return;
      }

      var actionEl = e.target.closest('[data-action]');
      if (actionEl) {
        var action = actionEl.dataset.action;
        var id = actionEl.dataset.id;
        switch (action) {
          case 'toggle-dashboard-dropdown': toggleDashboardDropdown(); return;
          case 'dropdown-navigate': navigate(actionEl.dataset.view); return;
          case 'filter-fleet': navigateFleetWithFilter(actionEl.dataset.filterStatus); return;
          case 'goto-reports':
            navigate('reports', { date_from: actionEl.dataset.dateFrom || '' });
            return;
          case 'reports-period':
            var pd = periodDates(actionEl.dataset.period);
            reportsFilters.period   = actionEl.dataset.period;
            reportsFilters.date_from = pd.date_from;
            reportsFilters.date_to   = pd.date_to;
            // Sync chip active state
            var pRow = document.getElementById('reports-period-chips');
            if (pRow) pRow.querySelectorAll('[data-period]').forEach(function (c) {
              c.classList.toggle('active', c.dataset.period === actionEl.dataset.period);
            });
            loadReports();
            return;
          case 'open-vehicle': navigate('detail', { id: id }); return;
          case 'log-service':  navigate('log', { id: id }); return;
          case 'edit-vehicle': navigate('add', { id: id }); return;
          case 'retire-vehicle':
            if (window.confirm('Mark this vehicle inactive? It will be hidden from the dashboard and the default fleet view (switch the Fleet "Show" filter to Inactive or All to find it again). Service history is kept.')) {
              setVehicleLifecycle(id, 'inactive');
            }
            return;
          case 'reactivate-vehicle': setVehicleLifecycle(id, 'active'); return;
          case 'manage-schedule': openScheduleModal(id); return;
          case 'cancel-form':  navigate(editingVehicle ? 'detail' : 'fleet',
                                        editingVehicle ? { id: editingVehicle.id } : null); return;
          case 'back-to-detail': navigate('detail', { id: currentVehicleId }); return;
          case 'open-service-picker': openServicePickerModal(); return;
          case 'pick-vehicle-for-service': closeModal(); navigate('log', { id: id }); return;
          case 'nav-add-vehicle': closeModal(); navigate('add'); return;
          case 'goto-vehicle-after-service': closeModal(); navigate('detail', { id: id }); return;
          case 'toggle-record':
            var rec = actionEl.closest('.record');
            rec.classList.toggle('open');
            rec.querySelector('.record-body').classList.toggle('hidden');
            return;
        }
      }

      // Top-nav buttons
      var nav = e.target.closest('.nav-btn');
      if (nav) { navigate(nav.dataset.view); return; }

      // Detail "Back" link
      if (e.target.closest('[data-back]')) {
        navigate('fleet'); return;
      }
    });

    // Close modal on Escape.
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeModal();
    });

    /* -------------------------------------------------------------------- */
    /* Public API (kept compatible with the scaffold)                       */
    /* -------------------------------------------------------------------- */
    window.RCI = {
      // navigation
      navigate: navigate,
      showView: navigate, // back-compat alias
      // server calls
      getDashboard: function () { return callServer('getDashboard'); },
      listVehicles: function (filters) { return callServer('listVehicles', [filters]); },
      getVehicle: function (id) { return callServer('getVehicle', [id]); },
      addVehicle: function (v) { return callServer('addVehicle', [v]); },
      updateVehicle: function (v) { return callServer('updateVehicle', [v]); },
      setVehicleStatus: function (id, status) { return callServer('setVehicleStatus', [id, status]); },
      logService: function (r) { return callServer('logService', [r]); },
      saveScheduleRule: function (rule) { return callServer('saveScheduleRule', [rule]); },
      uploadPhoto: function (vehicleId, dataUrl, filename) {
        return callServer('uploadPhoto', [vehicleId, dataUrl, filename]);
      },
      listServiceRecords: function (filters) { return callServer('listServiceRecords', [filters]); }
    };

    /* -------------------------------------------------------------------- */
    /* Sign-in gate                                                         */
    /* -------------------------------------------------------------------- */
    function showLoginGate(message) {
      var gate = $('#login-gate');
      var app = $('#app-root');
      var header = document.querySelector('.app-header');
      if (gate) gate.classList.remove('hidden');
      if (app) app.classList.add('hidden');
      if (header) header.classList.add('hidden');
      var msg = $('#login-msg');
      if (msg) msg.textContent = message || '';
    }

    function showApp() {
      var gate = $('#login-gate');
      var app = $('#app-root');
      var header = document.querySelector('.app-header');
      if (gate) gate.classList.add('hidden');
      if (app) app.classList.remove('hidden');
      if (header) header.classList.remove('hidden');
      wireFleetControls();
      wireReportsControls();
      navigate('dashboard');
    }

    function startApp() {
      // 1) Just signed in? The server injected a fresh token into the page.
      //    Trust it, persist it for next time, and go straight to the app.
      var injected = (typeof window.__RCI_SESSION__ === 'string') ? window.__RCI_SESSION__ : '';
      if (injected) {
        SESSION = injected;
        try { localStorage.setItem(SESSION_KEY, injected); } catch (e) {}
        showApp();
        return;
      }

      // 2) Returning visit: use the stored token, validated server-side first.
      var stored = getStoredSession();
      if (!stored) { showLoginGate(); return; }
      SESSION = stored;
      google.script.run
        .withSuccessHandler(function (who) {
          if (who && who.email) {
            showApp();
          } else {
            clearStoredSession();
            SESSION = null;
            showLoginGate();
          }
        })
        .withFailureHandler(function () {
          clearStoredSession();
          SESSION = null;
          showLoginGate('Could not verify your session. Please sign in again.');
        })
        .whoami(stored);
    }

    /* -------------------------------------------------------------------- */
    /* Boot                                                                 */
    /* -------------------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', function () {
      var loginBtn = document.getElementById('login-btn');
      if (loginBtn) {
        loginBtn.addEventListener('click', function () {
          var url = window.__RCI_AUTH_URL__;
          if (url) { window.top.location.href = url; }
        });
      }
      startApp();
    });
  })();
</script>
