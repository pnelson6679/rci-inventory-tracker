<style>
  /* RCI Inventory Tracker — base styles.
     High-contrast, construction-industry palette, large tap targets, mobile-first.
     The Web Designer / HTML Expert will expand this. */

  :root {
    --bg: #ffffff;
    --ink: #14181d;
    --primary: #0050b3;     /* bold blue */
    --primary-press: #003a82;
    --accent: #f57c00;      /* construction orange */
    --overdue: #d32f2f;     /* red */
    --due-soon: #f9a825;    /* yellow */
    --up-to-date: #2e7d32;  /* green */
    --no-schedule: #9e9e9e; /* grey */
    --card: #f5f7fa;
    --border: #d8dee6;
    --tap: 48px;            /* minimum tap target */
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-text-size-adjust: 100%;
  }

  .app-header {
    position: sticky;
    top: 0;
    background: var(--primary);
    color: #fff;
    padding: 12px 16px;
    z-index: 10;
  }
  .app-header h1 { font-size: 1.25rem; margin: 0 0 8px; }

  .app-nav { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-btn {
    min-height: var(--tap);
    padding: 0 16px;
    border: none;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.15);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .nav-btn.active { background: var(--accent); }

  main { padding: 16px; max-width: 1100px; margin: 0 auto; }

  .view { display: none; }
  .view.active { display: block; }

  .placeholder {
    color: var(--no-schedule);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 32px;
    text-align: center;
  }

  /* Status badge utility classes for the HTML Expert to reuse. */
  .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; color: #fff; font-weight: 700; font-size: 0.85rem; }
  .badge--overdue    { background: var(--overdue); }
  .badge--due-soon   { background: var(--due-soon); color: #14181d; }
  .badge--up-to-date { background: var(--up-to-date); }
  .badge--no-schedule{ background: var(--no-schedule); }

  /* Two-column dashboard on desktop. */
  @media (min-width: 768px) {
    .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
  }
</style>
