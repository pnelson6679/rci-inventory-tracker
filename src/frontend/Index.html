<!DOCTYPE html>
<html lang="en">
  <head>
    <base target="_top">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>RCI Inventory Tracker</title>
    <?!= include('frontend/styles'); ?>
    <style>
      /* Sign-in gate — shown until the visitor has a valid session token. */
      .login-gate {
        position: fixed; inset: 0; z-index: 1000;
        display: flex; align-items: center; justify-content: center;
        background: #f5f6f8; padding: 24px;
      }
      .login-card {
        background: #fff; border-radius: 14px; padding: 36px 28px; max-width: 380px; width: 100%;
        box-shadow: 0 10px 40px rgba(0,0,0,.08); text-align: center;
      }
      .login-card h1 { font-size: 1.35rem; margin: 0 0 6px; }
      .login-card p { color: #5f6368; margin: 0 0 22px; }
      .login-card .btn { width: 100%; }
      #login-msg { color: #b3261e; min-height: 1.2em; margin: 16px 0 0; font-size: .9rem; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <script>
      // Injected server-side: the Google sign-in URL for this deployment, and
      // (only right after a successful sign-in) the freshly minted session token.
      window.__RCI_AUTH_URL__ = <?!= JSON.stringify(AUTH_URL) ?>;
      window.__RCI_SESSION__  = <?!= JSON.stringify(SESSION_TOKEN) ?>;
    </script>

    <!-- Sign-in gate. Hidden once a valid session is established. -->
    <div id="login-gate" class="login-gate hidden">
      <div class="login-card">
        <h1>RCI Inventory Tracker</h1>
        <p>Sign in with your Google account to continue.</p>
        <button id="login-btn" type="button" class="btn btn-primary btn-lg">Sign in with Google</button>
        <p id="login-msg"></p>
      </div>
    </div>

    <!-- Single-page app shell. Views swap client-side (see frontend/scripts).
         Mobile-first. Five views: dashboard, fleet, detail, add (also edit), log. -->
    <header class="app-header hidden">
      <h1>RCI Inventory Tracker</h1>
      <nav class="app-nav">
        <!-- Dashboard dropdown: Fleet + Reports live inside it -->
        <div class="nav-drop-wrap" id="dashboard-nav-wrap">
          <button class="nav-btn active" id="dashboard-nav-btn"
                  data-action="toggle-dashboard-dropdown">
            Dashboard <span class="nav-caret">▾</span>
          </button>
          <div class="nav-drop-menu hidden" id="dashboard-nav-menu">
            <button class="nav-drop-item" data-action="dropdown-navigate" data-view="dashboard">Dashboard</button>
            <button class="nav-drop-item" data-action="dropdown-navigate" data-view="fleet">Fleet</button>
            <button class="nav-drop-item" data-action="dropdown-navigate" data-view="reports">Reports</button>
          </div>
        </div>
        <div class="nav-drop-wrap" id="add-nav-wrap">
          <button id="add-nav-btn" class="nav-btn" data-action="toggle-add-dropdown">
            + Add <span class="nav-caret">▾</span>
          </button>
          <div class="nav-drop-menu hidden" id="add-nav-menu">
            <button class="nav-drop-item" data-action="dropdown-add-vehicle">+ Add Vehicle</button>
            <button class="nav-drop-item" data-action="open-service-picker">+ Add Service</button>
          </div>
        </div>
      </nav>
    </header>

    <main id="app-root" class="hidden">
      <!-- Global error banner (shown above whichever view is active). -->
      <div id="error-banner" class="error-banner hidden" role="alert"></div>

      <!-- DASHBOARD -->
      <section id="view-dashboard" class="view active" aria-label="Dashboard">
        <div id="dashboard-body"></div>
      </section>

      <!-- FLEET -->
      <section id="view-fleet" class="view" aria-label="Fleet">
        <div class="filters">
          <input id="fleet-search" class="search-input" type="search"
                 placeholder="Search name, make, model, or ID…" autocomplete="off">
          <div class="chip-row" id="fleet-type-chips" data-group="type">
            <button class="chip active" data-value="">All types</button>
            <button class="chip" data-value="vehicle">Vehicles</button>
            <button class="chip" data-value="machinery">Machinery</button>
          </div>
          <div class="chip-row" id="fleet-status-chips" data-group="status">
            <button class="chip active" data-value="">All statuses</button>
            <button class="chip" data-value="overdue">Overdue</button>
            <button class="chip" data-value="due_soon">Due soon</button>
            <button class="chip" data-value="up_to_date">Up to date</button>
            <button class="chip" data-value="no_schedule">No schedule</button>
          </div>
          <div class="chip-row" id="fleet-lifecycle-chips" data-group="lifecycle">
            <button class="chip active" data-value="active">Active</button>
            <button class="chip" data-value="inactive">Inactive</button>
            <button class="chip" data-value="all">All</button>
          </div>
        </div>
        <div id="fleet-body"></div>
      </section>

      <!-- VEHICLE DETAIL -->
      <section id="view-detail" class="view" aria-label="Vehicle detail">
        <button class="back-link" data-back>&larr; Back</button>
        <div id="detail-body"></div>
      </section>

      <!-- ADD / EDIT VEHICLE -->
      <section id="view-add" class="view" aria-label="Add or edit vehicle">
        <div id="add-body"></div>
      </section>

      <!-- LOG SERVICE -->
      <section id="view-log" class="view" aria-label="Log service">
        <div id="log-body"></div>
      </section>

      <!-- SERVICE REPORTS -->
      <section id="view-reports" class="view" aria-label="Service Reports">
        <div class="filters">
          <input id="reports-search" class="search-input" type="search"
                 placeholder="Search vehicle, type, technician, notes…" autocomplete="off">
          <div class="chip-row" id="reports-period-chips">
            <button class="chip active" data-action="reports-period" data-period="all">All Time</button>
            <button class="chip" data-action="reports-period" data-period="month">This Month</button>
            <button class="chip" data-action="reports-period" data-period="30d">Last 30 Days</button>
            <button class="chip" data-action="reports-period" data-period="year">This Year</button>
          </div>
          <div class="chip-row" id="reports-type-chips" data-group="reports_service_type">
            <button class="chip active" data-value="">All service types</button>
            <button class="chip" data-value="Oil Change">Oil Change</button>
            <button class="chip" data-value="Inspection">Inspection</button>
            <button class="chip" data-value="Repair">Repair</button>
            <button class="chip" data-value="Tire Rotation">Tire Rotation</button>
            <button class="chip" data-value="Other">Other</button>
          </div>
        </div>
        <div id="reports-body"></div>
      </section>
    </main>

    <!-- Global UI helpers -->
    <div id="toast-wrap"></div>
    <div id="modal-root"></div>

    <?!= include('frontend/scripts'); ?>
  </body>
</html>
