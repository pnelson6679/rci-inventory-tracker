# CI/CD — pushes Apps Script source and redeploys to the fixed web app URL on every
# merge to main.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   CLASP_CREDENTIALS  — contents of ~/.clasprc.json after running `clasp login` locally
#   CLASP_SCRIPT_ID    — the scriptId from .clasp.json
#
# The deployment ID is read from the committed .deployment-id file (no secret needed
# because the deployment ID is not sensitive — it's already embedded in the public URL).
name: Deploy to Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate clasp
        run: echo "$CLASP_CREDENTIALS" > ~/.clasprc.json
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

      # .clasp.json is git-ignored; recreate it from secrets.
      - name: Restore .clasp.json
        run: |
          echo '{
            "scriptId": "${{ secrets.CLASP_SCRIPT_ID }}",
            "rootDir": "./src",
            "scriptExtensions": [".js", ".gs"],
            "htmlExtensions": [".html"],
            "jsonExtensions": [".json"]
          }' > .clasp.json

      - name: Push to Apps Script
        run: clasp push --force

      # Deploy to the same URL every time by updating the pinned deployment ID.
      # .deployment-id is committed to the repo so CI and local release.sh agree.
      - name: Deploy to fixed URL
        run: |
          if [ -f .deployment-id ]; then
            DEPLOYMENT_ID="$(cat .deployment-id)"
            echo "Updating deployment $DEPLOYMENT_ID..."
            clasp deploy \
              --deploymentId "$DEPLOYMENT_ID" \
              --description "CI release: ${{ github.sha }}"
            echo "Deployed. Web app URL:"
            clasp deployments | grep "$DEPLOYMENT_ID" || true
          else
            echo "No .deployment-id file found."
            echo "Run './release.sh' locally first to create the initial deployment and commit the ID."
            exit 1
          fi
